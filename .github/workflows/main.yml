    items.append({
        "title": title_map.get(video_id, source_title),
        "sourceTitle": source_title,
        "videoId": video_id,
        "position": snippet.get("position", i),
        "addedAt": snippet.get("publishedAt", ""),
        "genres": genre_map.get(video_id, ["Drama"])
    })

              page_token = data.get("nextPageToken", "")

              if not page_token:
                  break

          items.sort(key=lambda x: x["position"])

          os.makedirs("data", exist_ok=True)

          with open("data/catalogue.json", "w", encoding="utf-8") as f:
              json.dump(
                  {
                      "playlistId": playlist_id,
                      "source": "BammybestowedTV",
                      "updatedAt": datetime.now(timezone.utc).isoformat(),
                      "items": items
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Commit catalogue if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          git diff --cached --quiet || git commit -m "Update BammybestowedTV movie catalogue"
          git push
